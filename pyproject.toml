[build-system]
requires = ["flit_core >=3.11,<5"]
build-backend = "flit_core.buildapi"

[project]
name = "lenco-py"
version = "0.1.0"
description = "Unofficial Python SDK for the Lenco API v2 — accounts, transfers, collections, and webhooks"
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Victor Miti" }]
keywords = ["lenco", "payments", "zambia", "mobile-money", "fintech"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.27", "pydantic>=2.5"]

[project.urls]
Homepage = "https://github.com/engineervix/lenco-py"
Documentation = "https://engineervix.github.io/lenco-py/"
Repository = "https://github.com/engineervix/lenco-py"
Issues = "https://github.com/engineervix/lenco-py/issues"
Changelog = "https://github.com/engineervix/lenco-py/blob/main/CHANGELOG.md"

[project.optional-dependencies]
card = ["jwcrypto>=1.5"]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "pytest-cov>=7.0",
  "pytest-xdist>=3.6",
  "respx>=0.22",
  "mypy>=1.8",
  "black>=24",
  "ruff>=0.4",
  "jwcrypto>=1.5",
  "lefthook>=2.1",
  "commitizen>=4.0",
]

[tool.flit.module]
name = "lenco"

[tool.commitizen]
name = "cz_customize"
version_provider = "pep621"
tag_format = "v$version"
major_version_zero = true
update_changelog_on_bump = true
annotated_tag = true
version_files = [
  "src/lenco/__init__.py:__version__",
]
template = "utils/changelog_template.md.j2"
extras = { repo_url = "https://github.com/engineervix/lenco-py" }

# bump_pattern/bump_map are left unset, so cz_customize falls back to the
# same defaults cz_conventional_commits uses — version bumping is unchanged.
# What's overridden below just widens which commit types land in the
# changelog and gives each one an emoji section heading — see
# utils/changelog_template.md.j2 for the rendering.
[tool.commitizen.customize]
schema_pattern = '(?s)(build|bump|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\(\S+\))?!?: ([^\n\r]+)((\n\n.*)|(\s*))?$'
changelog_pattern = '^((BREAKING[\-\ ]CHANGE|\w+)(\(.+\))?!?):'
commit_parser = '^((?P<change_type>feat|fix|docs|style|refactor|perf|test|build|ci|BREAKING CHANGE)(?:\((?P<scope>[^()\r\n]*)\)|\()?(?P<breaking>!)?|\w+!):\s(?P<message>.*)?'
change_type_order = [
  "⚠ BREAKING CHANGES",
  "🚀 Features",
  "🐛 Bug Fixes",
  "📝 Docs",
  "💄 Styling",
  "♻️ Code Refactoring",
  "⚡ Performance Improvements",
  "✅ Tests",
  "⚙️ Build System",
  "👷 CI/CD",
]

[tool.commitizen.customize.change_type_map]
feat = "🚀 Features"
fix = "🐛 Bug Fixes"
docs = "📝 Docs"
style = "💄 Styling"
refactor = "♻️ Code Refactoring"
perf = "⚡ Performance Improvements"
test = "✅ Tests"
build = "⚙️ Build System"
ci = "👷 CI/CD"
"BREAKING CHANGE" = "⚠ BREAKING CHANGES"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["jwcrypto.*", "respx.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["SIM117"]                        # nested with (client + pytest.raises) reads better in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = [
  "--strict-markers",
  "--numprocesses=auto",
  "--cov-config=pyproject.toml",
  "--cov",
  "--cov-report=json",
  "--cov-report=term-missing:skip-covered",
]

[tool.coverage.run]
branch = true
source = ["src/lenco"]

[tool.coverage.report]
show_missing = true
skip_covered = true
